<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.search_title %}{{ page.search_title | escape }}{% else %}{{ page.title | escape }} · {{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  {% if page.url == '/' or page.url == '/index.html' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": {{ site.title | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }}
  }
  </script>
  {% endif %}
  <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png" sizes="192x192">
  <link rel="stylesheet" href="{{ '/assets/academic.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Marco Guaraco, home">Marco Guaraco</a>
    <nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}" {% if page.nav == 'research' %}aria-current="page"{% endif %}>Research</a><a href="{{ '/talks/' | relative_url }}" {% if page.nav == 'talks' %}aria-current="page"{% endif %}>Talks</a><a href="{{ '/teaching/' | relative_url }}" {% if page.nav == 'teaching' %}aria-current="page"{% endif %}>Teaching</a></nav>
  </div></header>
  <main id="main" class="page-shell">{{ content }}</main>
  <footer class="site-footer"><div class="footer-inner"><div><a class="footer-name" href="{{ '/' | relative_url }}">Marco Guaraco</a><p>Department of Mathematics<br>Imperial College London</p></div><a class="footer-email" href="mailto:guaraco@imperial.ac.uk">guaraco@imperial.ac.uk <span aria-hidden="true">↗</span></a></div></footer>
</body>
</html>
