    <path d="m30 143 5 7m-1-4 5 8m-1-5 5 9m-1-6 5 9m-1-6 6 9m-1-6 5 8 M195 157l-4 7m10-11-4 8m9-12-4 9m9-14-4 9" stroke="#71816f" stroke-width=".8" opacity=".5"/>
